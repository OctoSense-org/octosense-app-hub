[package]
name = "octosense-app-validator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Shared Card preparation and a native validation worker"

[dependencies]
octosense-app-hub = { path = "../app-hub" }
octosense-app-policy = { path = "../app-policy", features = ["splash"] }
octosense-app-runtime = { path = "../app-runtime" }
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "7786bb4a32d3282197699eefd2f2e9defbcf2d53" }
octoscript-makepad = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "4fe5cc50b828a6dba10cc003b7e3b055a23b83b1" }
octoscript-render = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "4fe5cc50b828a6dba10cc003b7e3b055a23b83b1" }
octoscript-widgets = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "4fe5cc50b828a6dba10cc003b7e3b055a23b83b1" }
serde_json = "1"
blake3 = "1"
rand_core = { version = "0.9", features = ["os_rng"] }

[dev-dependencies]
base64 = "0.22"

[[bin]]
name = "app-validator"
path = "src/main.rs"
