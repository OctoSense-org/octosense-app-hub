# octosense-appstore — the store, as an OctoSense app (ADR 0003 §7).
#
# Trusted tier by necessity: it holds the hub anchor, writes app jails and is
# the one place that installs. It ships in the build like any other module,
# and like any other module it also runs standalone through octosense-app-host.
[package]
name = "octosense-appstore"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Browse, search, install and open apps published to the OctoSense app hub"

[dependencies]
octosense-app-validator = { path = "../app-validator" }
octosense-app-hub = { path = "../app-hub" }
octosense-app-policy = { path = "../app-policy", features = ["splash"] }
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "7786bb4a32d3282197699eefd2f2e9defbcf2d53" }
makepad-app-module = { git = "https://github.com/OctoSense-org/makepad.git", rev = "7786bb4a32d3282197699eefd2f2e9defbcf2d53" }
octoscript-makepad = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "4de95e1d25b556b8b2a123ec32e3a1bbad7edbd2" }
octoscript-widgets = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "4de95e1d25b556b8b2a123ec32e3a1bbad7edbd2" }
serde_json = "1"
