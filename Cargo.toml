# The OctoSense app hub: the crates behind the catalog in this repository.
#
#   app-policy    the signed manifest and listing; admission; resolution into
#                 an isolate's settings and an agent session profile (ADR 0002)
#   app-hub       the index, the signed catalog, the gate, the scan, the device
#                 client and the `hub` command (ADR 0003)
#   appstore      the store as an OctoSense module, plus the `card` host module
#                 that runs an installed app as its own client
#   appstore-app  the store as a standalone app
#   card-host     the reference contained host for one card bundle
#   app-host      a one-window host for any AppModule
#   app-hub-app   the shell integration every OctoSense shell links: the
#                 native store module, the Card runner, system apps, icons
[workspace]
resolver = "2"
members = [
    "crates/app-policy",
    "crates/app-hub",
    "crates/appstore",
    "crates/appstore-app",
    "crates/card-host",
    "crates/app-host",
    "crates/app-validator",
    "crates/app-hub-app",
    "crates/app-runtime",
]

# Builds resolve the pinned sources from the prepared sibling checkouts, as
# the OctoSense launcher workspace does.
[patch."https://github.com/OctoSense-org/makepad.git"]
makepad-widgets = { path = "../makepad/widgets" }
makepad-app-module = { path = "../makepad/libs/app_module" }
makepad-script = { path = "../makepad/platform/script" }
makepad-ai-services = { path = "../makepad/libs/ai/services" }
makepad-strict-json = { path = "../makepad/libs/strict_json" }
makepad-studio-protocol = { path = "../makepad/platform/studio" }
makepad-network = { path = "../makepad/platform/network" }
makepad-wm-theme = { path = "../makepad/libs/wm_theme" }
